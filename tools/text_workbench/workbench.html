<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>初代热血硬派 · 汉化校对工作台</title>
<style>
:root{--ink:#183039;--muted:#637780;--line:#dce6e8;--paper:#fff;--bg:#f3f7f8;--teal:#087f83;--tint:#e7f5f4;--red:#ae3434;--amber:#93651b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:8px;padding:7px 13px;color:var(--ink);transition:background .15s}button:hover{background:var(--tint);border-color:#a0cdcb}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--teal);color:white;border-color:var(--teal)}button.primary:hover{background:#076d70}button.quiet{background:transparent}button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid #7dc9c8;outline-offset:2px}
.top{background:white;border-bottom:1px solid var(--line);padding:18px 28px 14px;display:flex;gap:18px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;background:var(--ink);color:white;border-radius:12px;display:grid;place-items:center;font-size:23px;font-weight:700}.title{font-size:20px;font-weight:700;letter-spacing:.4px}.subtitle{font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions button{font-size:13px}.statusline{padding:9px 28px;background:white;display:flex;gap:20px;align-items:center;font-size:12px;color:var(--muted)}.pill{background:var(--tint);color:var(--teal);padding:3px 10px;border-radius:20px}.statusline strong{color:var(--ink);font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 126px);min-height:600px}.sidebar{background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.filters{padding:18px 16px 12px;border-bottom:1px solid var(--line)}.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}.filterrow{display:flex;gap:8px;margin-top:9px}.filterrow select{width:50%;min-width:0;padding:7px;border:1px solid var(--line);border-radius:7px;background:white;font-size:13px}.resultbar{font-size:12px;color:var(--muted);padding:10px 17px}.results{overflow:auto;flex:1;padding:0 8px 12px}.entry{width:100%;display:block;border:none;border-radius:8px;text-align:left;padding:12px;margin-bottom:3px;background:white}.entry.selected{background:var(--tint);box-shadow:inset 3px 0 var(--teal)}.entry:hover{background:#f0f6f7}.entry-top{font-size:11px;display:flex;justify-content:space-between;gap:4px;color:var(--muted)}.entry-main{margin-top:4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiny{font-size:10px;white-space:nowrap}.tag-edit{color:var(--teal)}.tag-review{color:#517043}.tag-flag{color:var(--amber)}.tag-error{color:var(--red)}.empty{padding:40px 20px;text-align:center;color:var(--muted)}.sidefoot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.main{overflow:auto;padding:24px 28px 40px}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:14px}.detail-head h1{margin:0;font-size:22px;font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:4px}.navigation{display:flex;gap:7px;flex-shrink:0}.info{font-size:12px;padding:10px 12px;border:1px solid #d6e8dc;background:#f2faf5;border-radius:8px;margin-bottom:14px;color:#456750;display:none}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden}.card-head{padding:12px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:650}.card-head span{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:1px}.text-view{padding:18px;min-height:132px;font-size:17px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.marker{display:inline-block;font-size:11px;line-height:1.5;padding:2px 6px;background:#eff3f5;color:#6a7782;border-radius:4px;vertical-align:middle;white-space:normal;margin:2px 3px}.marker.pause{background:#fcf5e8;color:#997023}.marker.end{color:#9eaab0;background:transparent;font-size:10px}.editor-card{margin-top:16px}.editor-card .card-head{background:#f7fbfb}.editor-note{font-size:12px;color:var(--muted);padding:12px 18px 0}.editor{padding:12px 18px 16px;font-size:17px;line-height:1.9}.segment{width:100%;display:block;resize:vertical;min-height:44px;max-height:240px;overflow:auto;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;line-height:1.7;color:var(--ink);margin:5px 0}.segment.changed{background:#f0faf8;border-color:#a8d4cd}.tokenline{line-height:1.6;min-height:5px}.editor-empty{color:var(--muted);padding:12px 0}.edit-actions{border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.edit-actions .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.edit-actions button{font-size:13px}.local-state{font-size:12px;color:var(--teal)}.validation{padding:0 18px 12px;color:var(--red);font-size:12px;display:none}.notes{margin-top:16px;background:white;border:1px solid var(--line);border-radius:12px;padding:14px 18px}.notes label{font-size:13px;font-weight:650}.notes textarea{display:block;width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:10px;margin-top:8px;line-height:1.7;font-size:13px}.raw{margin-top:16px;font-size:12px;color:var(--muted)}.raw summary{cursor:pointer}.raw pre{white-space:pre-wrap;word-break:break-word;font-family:Consolas,monospace;font-size:12px;color:var(--ink);border:1px solid var(--line);background:white;border-radius:8px;padding:12px}.footerhint{font-size:12px;color:var(--muted);margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;max-width:85vw;padding:12px 20px;border-radius:9px;box-shadow:0 6px 24px #18303922;z-index:20;display:none;white-space:pre-wrap;font-size:13px}.modal{position:fixed;inset:0;background:#10232b55;z-index:30;display:none;align-items:center;justify-content:center;padding:24px}.modal-box{width:min(640px,100%);max-height:85vh;overflow:auto;background:white;border-radius:14px;padding:24px}.modal-box h2{margin-top:0;font-size:20px}.modal-box p,.modal-box li{font-size:14px}.modal-box code{background:#eff4f5;padding:2px 5px;border-radius:4px}.modal-actions{text-align:right;margin-top:20px}
@media(max-width:1050px){.layout{grid-template-columns:240px minmax(0,1fr)}.main{padding:20px}.top{padding:14px 20px}.compare{grid-template-columns:1fr}.top-actions button{padding:6px 10px}.title{font-size:17px}}
@media(max-width:700px){.top{flex-direction:column;align-items:start;gap:12px}.statusline{padding:8px 14px;flex-wrap:wrap;gap:8px 15px}.layout{height:auto;display:block;min-height:0}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.results{max-height:230px}.sidefoot{display:none}.main{padding:16px}.detail-head{gap:8px}.detail-head h1{font-size:19px}.navigation button{font-size:12px;padding:5px 8px}.text-view{font-size:16px}.top-actions{gap:6px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="mark" aria-hidden="true">译</div><div><div class="title">初代热血硬派 · 汉化校对工作台</div><div class="subtitle">日文原文 × 中文译文 · 离线协作版</div></div></div>
 <div class="top-actions">
  <button id="help">使用说明</button><button id="csv">导出对照表</button><button id="import">导入修订稿</button><button class="primary" id="export">导出修订稿</button>
 </div>
</header>
<div class="statusline"><span class="pill" id="version"></span><span><strong id="total">0</strong> 条对照</span><span><strong id="modified">0</strong> 条修订</span><span><strong id="reviewed">0</strong> 条已校</span><span id="save-status" role="status" aria-live="polite">正在读取本地记录…</span></div>
<div class="layout">
 <aside class="sidebar">
  <div class="filters"><input class="search" id="search" type="search" placeholder="搜索原文、译文、编号或备注" aria-label="搜索原文、译文、编号或备注"><div class="filterrow">
   <select id="category" aria-label="内容分类"><option value="">全部内容</option></select>
   <select id="filter" aria-label="校对状态"><option value="">全部状态</option><option value="unreviewed">未校对</option><option value="edited">已修订</option><option value="reviewed">已校对</option><option value="flagged">待确认</option><option value="invalid">需调整</option></select>
  </div></div>
  <div class="resultbar" id="result-count"></div><div class="results" id="results" aria-label="文本条目列表"></div>
  <div class="sidefoot">修改自动暂存在本机浏览器。<br>发给别人前，请导出修订稿。</div>
 </aside>
 <main class="main" id="main">
  <div class="detail-head"><div><h1 id="entry-title"></h1><div id="entry-meta" class="meta"></div></div><div class="navigation"><button id="prev" title="Alt + ←">上一条</button><button id="next" title="Alt + →">下一条</button></div></div>
  <div class="info" id="entry-info"></div>
  <div class="compare">
   <section class="card"><div class="card-head">日文原文<span>ORIGINAL</span></div><div class="text-view" id="original"></div></section>
   <section class="card"><div class="card-head">当前中文<span>BASE TRANSLATION</span></div><div class="text-view" id="translation"></div></section>
  </div>
  <section class="card editor-card"><div class="card-head">你的修订<span id="edit-badge">未修改</span></div>
   <div class="editor-note" id="editor-note">直接修改下面的文字。灰色标记由游戏替换，不能编辑。</div>
   <div class="editor" id="editor"></div><div class="validation" id="validation" role="alert"></div>
   <div class="edit-actions"><div class="left"><button class="primary" id="mark-reviewed">标记已校对</button><button id="mark-flagged">标记待确认</button><button id="restore">恢复原译</button></div><span class="local-state" id="entry-status"></span></div>
  </section>
  <div class="notes"><label for="notes">校对备注</label><textarea id="notes" placeholder="记录疑问、语境或改动理由（随修订稿一起导出）" maxlength="2000"></textarea></div>
  <details class="raw"><summary>查看游戏标记和完整文本</summary><div>原文</div><pre id="raw-original"></pre><div>当前译文</div><pre id="raw-translation"></pre><div>修订文本</div><pre id="raw-revision"></pre></details>
  <div class="footerhint">Ctrl + S 导出修订稿 · Ctrl + Enter 标记已校对 · Alt + ← / → 切换条目<br>这是一份文字校对工作台；保存修订不会直接改变 ROM。</div>
 </main>
</div>
<input id="file-input" type="file" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-box"><h2 id="modal-title">怎样一起校对</h2><div id="modal-body"></div><div class="modal-actions"><button class="primary" id="close-modal">知道了</button></div></div></div>
<script id="catalog" type="application/json">@@CATALOG@@</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('catalog').textContent);
const $=id=>document.getElementById(id);
const ENTRIES=DATA.entries, BYKEY=new Map(ENTRIES.map(e=>[e.key,e]));
const STORE='kunio-workbench-v1:'+DATA.fingerprint;
const EXPORT_FORMAT='kunio-workbench-revisions-v1';
const TOKEN=/\{([0-9A-Fa-f]{2,4})\}/g;
let state={revisions:{}},selected='',visible=[],saveTimer,toastTimer;
let storageOK=true;
function split(s){const segments=[],tokens=[];let at=0;for(const m of s.matchAll(TOKEN)){segments.push(s.slice(at,m.index));tokens.push(m[0]);at=m.index+m[0].length;}segments.push(s.slice(at));return {segments,tokens};}
function tokens(s){return Array.from(s.matchAll(TOKEN),m=>m[0]);}
function current(e){return state.revisions[e.key]?.translation??e.translation;}
function info(e){return state.revisions[e.key]??{translation:e.translation,note:'',status:'unreviewed'};}
function modified(e){return current(e)!==e.translation;}
function invalid(e,text=current(e)){
 if(typeof text!=='string'||text.length>5000)return '文本过长或格式不正确。';
 if(!e.editable&&text!==e.translation)return '此条是空内容或结束边界，请保留原文本。';
 if(e.target.kind==='name'){
  if(Array.from(text).length<1||Array.from(text).length>2)return '人物名必须是一至两个字，姓名栏只能放下两个汉字。';
  if(/[\s{}]/.test(text))return '人物名不能包含空格或游戏标记。';
 }else{
  if(JSON.stringify(tokens(text))!==JSON.stringify(tokens(e.translation)))return '游戏标记发生了变化，请恢复原标记后再导入。';
  if(/[{}]/.test(text.replace(TOKEN,'')))return '文字内不能输入花括号；灰色游戏标记已为你保留。';
  if(/[\r\n]/.test(text))return '换行由原游戏标记控制；段内换行请改为空格。';
 }
 if(/[\u0000-\u0008\u000B-\u001F\u007F]/.test(text))return '含有不可显示的控制字符。';
 return '';
}
function toast(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',4800);}
function persist(){
 clearTimeout(saveTimer);
 try{localStorage.setItem(STORE,JSON.stringify({fingerprint:DATA.fingerprint,revisions:state.revisions}));storageOK=true;$('save-status').textContent='已自动暂存 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false});}
 catch(error){storageOK=false;$('save-status').textContent='浏览器无法暂存，请导出修订稿保存';}
}
function schedule(){ $('save-status').textContent='正在暂存…';clearTimeout(saveTimer);saveTimer=setTimeout(persist,400);}
function stats(){
 $('total').textContent=ENTRIES.length.toLocaleString('zh-CN');
 $('modified').textContent=ENTRIES.filter(modified).length;
 $('reviewed').textContent=ENTRIES.filter(e=>info(e).status==='reviewed').length;
}
function compact(s){return s.replace(TOKEN,' ').replace(/\s+/g,' ').trim();}
function statusText(e){if(invalid(e))return ['需调整','tag-error'];const s=info(e).status;if(s==='flagged')return ['待确认','tag-flag'];if(s==='reviewed')return ['已校对','tag-review'];if(modified(e))return ['已修订','tag-edit'];return ['未校对',''];}
function matches(e){
 const group=$('category').value,filter=$('filter').value,q=$('search').value.trim().toLocaleLowerCase();
 if(group&&e.group!==group)return false;
 const i=info(e);
 if(filter==='edited'&&!modified(e))return false;
 if(filter==='reviewed'&&i.status!=='reviewed')return false;
 if(filter==='flagged'&&i.status!=='flagged')return false;
 if(filter==='unreviewed'&&i.status!=='unreviewed')return false;
 if(filter==='invalid'&&!invalid(e))return false;
 return !q||[e.label,e.key,e.original,e.translation,current(e),i.note].join(' ').toLocaleLowerCase().includes(q);
}
function renderList(){
 visible=ENTRIES.filter(matches);$('result-count').textContent='找到 '+visible.length+' 条'+(visible.length<ENTRIES.length?' / 共 '+ENTRIES.length+' 条':'');
 const fragment=document.createDocumentFragment();
 for(const e of visible){const b=document.createElement('button');b.className='entry'+(selected===e.key?' selected':'');b.dataset.key=e.key;
 const top=document.createElement('div');top.className='entry-top';const label=document.createElement('span');label.textContent=e.label+' · '+e.group;const badge=document.createElement('span');const st=statusText(e);badge.className='tiny '+st[1];badge.textContent=st[0];top.append(label,badge);
 const line=document.createElement('div');line.className='entry-main';line.textContent=compact(current(e))||'（空内容／游戏标记）';b.append(top,line);b.addEventListener('click',()=>selectEntry(e.key));fragment.append(b);}
 $('results').replaceChildren(fragment);
 if(!visible.length){const e=document.createElement('div');e.className='empty';e.textContent='没有匹配的条目。试试其他关键词或分类。';$('results').append(e);}
 nav();
}
function tokenLabel(raw){
 const t=raw.slice(1,-1).toUpperCase();
 const vars={'E0':'变量 E0','E1':'变量 E1','E2':'姓名 E2','E3':'姓名 E3','E4':'姓名 E4','E5':'姓名 E5','E6':'姓名 E6','E7':'名称 E7','E8':'名称 E8','E9':'名称 E9','EA':'名称 EA','EB':'名称 EB','EC':'名称 EC','ED':'动态文字 ED','EE':'动态文字 EE','EF':'数值 EF'};
 if(vars[t])return vars[t];
 return {'F0':'说话人格式','F1':'控制 F1','F2F6':'换行','F2F7':'继续下一段','F2F4':'翻页／等待','F2F3':'结束','F3':'结束','F7':'停顿','F6':'原排版留白','F2':'继续读取'}[t]||('原标记 '+t);
}
function tokenNode(raw){
 const e=document.createElement('span');const t=raw.slice(1,-1).toUpperCase();e.className='marker'+(t==='F7'?' pause':'')+(['F3','F2F3'].includes(t)?' end':'');e.textContent='‹'+tokenLabel(raw)+'›';e.title=raw+' · 原游戏标记，保留不改';return e;
}
function view(target,text){
 const parsed=split(text);const nodes=[];
 parsed.segments.forEach((part,i)=>{nodes.push(document.createTextNode(part));if(i<parsed.tokens.length){const t=parsed.tokens[i];nodes.push(tokenNode(t));if(['{F2F6}','{F2F7}','{F2F4}'].includes(t))nodes.push(document.createElement('br'));}});
 target.replaceChildren(...nodes);
}
function record(e,patch){
 const previous=info(e);const next={translation:previous.translation,note:previous.note||'',status:previous.status||'unreviewed',...patch,updated_at:new Date().toISOString()};
 if(patch.translation!==undefined&&patch.translation!==previous.translation&&previous.status==='reviewed')next.status='unreviewed';
 if(next.translation===e.translation&&!next.note&&next.status==='unreviewed')delete state.revisions[e.key];else state.revisions[e.key]=next;
 schedule();stats();renderEntryState();
 const b=$('results').querySelector('button.selected');if(b){b.querySelector('.entry-main').textContent=compact(next.translation)||'（空内容／游戏标记）';const st=statusText(e);const badge=b.querySelector('.tiny');badge.textContent=st[0];badge.className='tiny '+st[1];}
}
function nav(){const at=visible.findIndex(e=>e.key===selected);$('prev').disabled=at<=0;$('next').disabled=at<0||at>=visible.length-1;}
function selectEntry(key){
 selected=key;const e=BYKEY.get(key);const i=info(e);$('main').style.display='block';
 $('entry-title').textContent=e.label;$('entry-meta').textContent=e.group+' · '+DATA.base_version;$('entry-info').textContent=e.note;$('entry-info').style.display=e.note?'block':'none';
 view($('original'),e.original);view($('translation'),e.translation);$('notes').value=i.note||'';
 $('raw-original').textContent=e.original;$('raw-translation').textContent=e.translation;
 const parsed=split(current(e)),base=split(e.translation),nodes=[];
 $('editor-note').textContent=e.target.kind==='name'?'共享姓名词条。请输入一至两个字；只改变姓名译法，不改变角色数据。':(e.editable?'直接修改下面的文字。灰色标记由游戏替换，不能编辑；段内回车自动变成空格。':'此条是原游戏的空内容／结束边界，不能改正文，但可以记录备注。');
 parsed.segments.forEach((part,index)=>{
  if(e.editable&&(part.length||e.target.kind==='name')){const field=document.createElement('textarea');field.className='segment'+(part!==base.segments[index]?' changed':'');field.value=part;field.rows=Math.min(5,Math.max(1,Math.ceil(part.length/40)));field.dataset.index=String(index);field.setAttribute('aria-label','修订文字第 '+(index+1)+' 段');
   const change=()=>{const pieces=parsed.segments.slice();$('editor').querySelectorAll('textarea').forEach(t=>{pieces[Number(t.dataset.index)]=t.value.replace(/[\r\n]+/g,' ');});let text='';pieces.forEach((p,j)=>{text+=p+(parsed.tokens[j]||'');});field.classList.toggle('changed',pieces[index]!==base.segments[index]);record(e,{translation:text});};
   field.addEventListener('input',change);field.addEventListener('blur',()=>{field.value=field.value.replace(/[\r\n]+/g,' ');});nodes.push(field);
  }else if(part)nodes.push(document.createTextNode(part));
  if(parsed.tokens[index]){const line=document.createElement('div');line.className='tokenline';line.append(tokenNode(parsed.tokens[index]));nodes.push(line);}
 });
 $('editor').replaceChildren(...nodes);
 if(!e.editable){const empty=document.createElement('div');empty.className='editor-empty';empty.textContent='（无可显示正文）';$('editor').prepend(empty);}
 renderEntryState();renderList();$('results').querySelector('button.selected')?.scrollIntoView({block:'nearest'});
}
function renderEntryState(){
 const e=BYKEY.get(selected);if(!e)return;const i=info(e),error=invalid(e),st=statusText(e);$('edit-badge').textContent=modified(e)?'已修订 · 自动暂存':'未修改';$('entry-status').textContent=st[0];$('validation').textContent=error;$('validation').style.display=error?'block':'none';$('raw-revision').textContent=current(e);$('mark-reviewed').disabled=Boolean(error);$('mark-reviewed').textContent=i.status==='reviewed'?'取消已校对':'标记已校对';$('mark-flagged').textContent=i.status==='flagged'?'取消待确认':'标记待确认';
}
function move(delta){const at=visible.findIndex(e=>e.key===selected);if(at>=0&&visible[at+delta])selectEntry(visible[at+delta].key);}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function dateTag(){return new Date().toISOString().slice(0,10);}
function exportDocument(){
 const revisions={};for(const [key,value]of Object.entries(state.revisions)){const e=BYKEY.get(key);if(!e)continue;const error=invalid(e,value.translation);if(error)throw new Error(e.label+'：'+error);revisions[key]={source_hash:e.source_hash,base_hash:e.base_hash,original:e.original,base_translation:e.translation,translation:value.translation,note:value.note||'',status:value.status||'unreviewed',target:e.target,updated_at:value.updated_at||''};}
 return {format:EXPORT_FORMAT,catalog_fingerprint:DATA.fingerprint,project:DATA.title,base_version:DATA.base_version,base_rom_crc32:DATA.base_rom_crc32,exported_at:new Date().toISOString(),revisions};
}
function exportFile(){try{persist();const doc=exportDocument();download('热血硬派_修订稿_'+dateTag()+'.json',JSON.stringify(doc,null,2),'application/json;charset=utf-8');toast('已导出 '+Object.keys(doc.revisions).length+' 条记录。请保留这个文件，发回后即可核对并合入译文。');}catch(error){toast('无法导出：'+error.message);}}
function validateImport(doc){
 if(!doc||doc.format!==EXPORT_FORMAT||doc.catalog_fingerprint!==DATA.fingerprint)throw new Error('修订稿不属于这份工作台，请使用相同版本的工作台。');
 if(!doc.revisions||Array.isArray(doc.revisions)||typeof doc.revisions!=='object')throw new Error('修订记录格式不正确。');
 const result=[];
 for(const [key,v]of Object.entries(doc.revisions)){
  const e=BYKEY.get(key);if(!e)throw new Error('发现未知条目：'+key);
  if(!v||v.source_hash!==e.source_hash||v.base_hash!==e.base_hash||v.original!==e.original||v.base_translation!==e.translation||JSON.stringify(v.target)!==JSON.stringify(e.target))throw new Error(e.label+' 的原文、基准译文或目标不一致。');
  const error=invalid(e,v.translation);if(error)throw new Error(e.label+'：'+error);
  if(!['unreviewed','reviewed','flagged'].includes(v.status)||typeof v.note!=='string'||v.note.length>2000)throw new Error(e.label+' 的状态或备注不正确。');
  result.push([key,{translation:v.translation,note:v.note,status:v.status,updated_at:v.updated_at||new Date().toISOString()}]);
 }return result;
}
function importFile(file){
 if(!file)return;if(file.size>12*1024*1024){toast('文件过大，请选择工作台导出的 JSON 修订稿。');return;}
 file.text().then(text=>{const rows=validateImport(JSON.parse(text));let conflict=0;for(const [key,v]of rows){const local=state.revisions[key];if(local&&(local.translation!==v.translation||local.note!==v.note||local.status!==v.status))conflict++;}
  if(conflict&&!confirm('有 '+conflict+' 条记录与你本机的修订不同。\n导入会采用文件中的版本；本机其他记录保留。\n建议先导出备份，再确定导入。'))return;
  for(const [key,v]of rows)state.revisions[key]=v;persist();stats();selectEntry(selected||rows[0]?.[0]||ENTRIES[0].key);toast('已导入 '+rows.length+' 条记录。未包含在文件中的本机修订已保留。');
 }).catch(error=>toast('未导入：'+error.message)).finally(()=>$('file-input').value='');
}
function exportCsv(){
 const field=s=>'"'+String(s).replace(/"/g,'""')+'"';const rows=[['条目编号','分类','日文原文','当前中文','修订中文','校对状态','备注']];
 for(const e of ENTRIES)rows.push([e.label,e.group,e.original,e.translation,current(e),statusText(e)[0],info(e).note||'']);
 // Prefix spreadsheet formulas; exports remain a read-only exchange copy.
 const safe=s=>/^[=+\-@\t\r]/.test(String(s))?"'"+s:s;
 download('热血硬派_原文译文对照_'+dateTag()+'.csv','\ufeff'+rows.map(r=>r.map(s=>field(safe(s))).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('已导出全部对照表。CSV 用于阅读交流；要回传修订请使用 JSON 修订稿。');
}
$('version').textContent=DATA.base_version+' · 离线版';
for(const group of DATA.categories){const o=document.createElement('option');o.value=o.textContent=group;$('category').append(o);}
$('search').addEventListener('input',renderList);$('category').addEventListener('change',renderList);$('filter').addEventListener('change',renderList);
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));
$('notes').addEventListener('input',()=>record(BYKEY.get(selected),{note:$('notes').value}));
$('mark-reviewed').addEventListener('click',()=>{const e=BYKEY.get(selected);record(e,{status:info(e).status==='reviewed'?'unreviewed':'reviewed'});renderList();});
$('mark-flagged').addEventListener('click',()=>{const e=BYKEY.get(selected);record(e,{status:info(e).status==='flagged'?'unreviewed':'flagged'});renderList();});
$('restore').addEventListener('click',()=>{const e=BYKEY.get(selected);if(modified(e)&&!confirm('恢复这条的当前中文译文？备注会保留。'))return;record(e,{translation:e.translation,status:'unreviewed'});selectEntry(e.key);});
$('export').addEventListener('click',exportFile);$('csv').addEventListener('click',exportCsv);$('import').addEventListener('click',()=>$('file-input').click());$('file-input').addEventListener('change',()=>importFile($('file-input').files[0]));
$('help').addEventListener('click',()=>{
 $('modal-body').innerHTML='<p>本工作台含 <strong>'+DATA.text_count+' 条文本</strong>（含优化版新增内容）和 <strong>'+DATA.name_count+' 个共享姓名词条</strong>。双击 HTML 即可离线使用。</p><ol><li>在左侧搜索或选择分类，查看日文原文和当前中文。</li><li>在“你的修订”中改文字，灰色游戏标记会自动保留。修订及备注暂存在当前浏览器。</li><li>校对完点击“导出修订稿”，把 JSON 文件发回。对方可以“导入修订稿”继续校对。</li></ol><p><strong>只发送原 HTML 不会带上你的修改。</strong>分享已改内容时，请同时发送导出的修订稿。换电脑、浏览器或文件位置前也请先导出。</p><p>原文中的姓名、道具和数值由游戏运行时决定，灰色标记只说明其种类，不虚构具体角色。部分条目应结合前后文理解。</p><p>“导出对照表”提供全部内容的 CSV，可用表格软件查看；回传修改请用 JSON。存读档、命名键盘、标题按原项目范围不在本工作台内。</p><p>导出文字修订不等于生成新 ROM。合入工程后仍需重建字库、检查容量并验证游戏显示。</p>';
 $('modal').style.display='flex';$('close-modal').focus();
});
$('close-modal').addEventListener('click',()=>$('modal').style.display='none');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').style.display='none';});
document.addEventListener('keydown',e=>{if(e.isComposing)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportFile();}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('mark-reviewed').click();}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();move(-1);}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();move(1);}if(e.key==='Escape')$('modal').style.display='none';});
window.addEventListener('pagehide',persist);
try{
 const raw=localStorage.getItem(STORE);
 if(raw){const saved=JSON.parse(raw);if(saved.fingerprint===DATA.fingerprint&&saved.revisions&&typeof saved.revisions==='object'){
  for(const [key,v]of Object.entries(saved.revisions)){if(BYKEY.has(key)&&v&&typeof v.translation==='string'&&typeof v.note==='string'&&['unreviewed','reviewed','flagged'].includes(v.status))state.revisions[key]=v;}
 }}
 $('save-status').textContent=raw?'已恢复本机校对记录':'本机自动暂存已就绪';
}catch(error){storageOK=false;$('save-status').textContent='暂存不可用，请及时导出修订稿';}
stats();selectEntry(ENTRIES[0].key);
// Pure validation helpers are exposed for the source-only test harness.
window.workbenchChecks={split,invalid,validateImport,exportDocument};
</script>
</body>
</html>
